x-common: &common
  build: .
  image: tovarnyi_otchet_bot:v3.1
  env_file: .env
  volumes:
    - ./creds:/app/creds  # token.json обновляется на ходу, поэтому не read-only
  restart: unless-stopped

services:
  app:
    <<: *common
    command: python app.py --schedule

  bot:
    <<: *common
    command: python bot.py
